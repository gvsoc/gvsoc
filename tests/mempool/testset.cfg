from gvtest.testsuite import *
import os

# Binaries of software/bin which are run, kept short to limit the runtime
tests = [
    'apps/baremetal/hello_world',
    'apps/baremetal/matmul_f8',
    'apps/baremetal/matmul_f16',
    'apps/baremetal/matmul_f32',
    'apps/baremetal/matrix_mul',
]

def testset_build(testset):

    testset.set_name('mempool')

    # The binaries are fetched from the MemPool CI by make test.checkout.mempool. Without them there
    # is no test.
    cwd = testset.get_path()
    bin_dir = f'{cwd}/apps-llvm-mempool/software/bin'
    if not os.path.isdir(bin_dir):
        return

    for name in tests:
        work_dir = f'{cwd}/work/{name}'
        test = testset.new_test(name)
        test.add_command(Shell('run',
            f'gvrun --target mempool --work-dir {work_dir} --param mempool_soc/binary={bin_dir}/{name} run'))
